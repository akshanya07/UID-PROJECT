<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SplitMate</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0d1117;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body class="text-white">

    <div id="app">

        <nav class="bg-[#161b22] border-b border-[#30363d] px-6 py-4 flex flex-col md:flex-row md:items-center 
        md:justify-between gap-4">

            <div class="flex items-center gap-3">

                <div class="w-10 h-10 rounded-xl bg-emerald-400 text-black font-extrabold flex 
                items-center justify-center "> S </div>

                <h1 class="text-2xl font-bold text-blue-300">
                    SplitMate
                </h1>

            </div>


            <ul class="flex flex-wrap gap-5 text-gray-300 font-medium">

                <li><a href="home.html" class="hover:text-emerald-400">Home</a></li>

                <li><a href="chores.html" class="hover:text-emerald-400">Chores</a></li>

                <li><a href="expenses.html" class="hover:text-emerald-400">Expenses</a></li>

                <li><a href="about.html" class="hover:text-emerald-400"> About</a></li>

                <li><a href="faq.html" class="hover:text-emerald-400"> FAQ</a></li>

                <li><a href="contact.html" class="hover:text-emerald-400"> Contact</a></li>

            </ul>

        </nav>



        <main class="p-6 lg:p-8">
            <section class="bg-[#161b22] border border-[#30363d] rounded-3xl p-8 lg:p-10">

                <p class="text-emerald-400 uppercase tracking-widest text-sm font-bold mb-3">
                    Welcome Back
                </p>

                <h1 class="text-2xl lg:text-5xl font-extrabold mb-4">Hey, Admin!</h1>

                <p class="text-gray-400 max-w-2xl leading-7">Track shared expenses and chores —
                    split fairly and settle easily.</p>


                <div class="flex flex-wrap gap-3 mt-8">

                    <div class="bg-emerald-400/10 border border-emerald-400/20 text-emerald-400 px-4 py-2 rounded-full 
                    text-sm font-semibold" id="nexpense"> Total ₹0 </div>

                    <div class="bg-blue-400/10 border border-blue-400/20 text-blue-300 px-4 py-2 rounded-full
                        text-sm font-semibold" id="ngrps">0 Groups</div>

                    <div class="bg-purple-400/10 border border-purple-400/20 text-purple-300 px-4 py-2
                        rounded-full text-sm font-semibold" id="nchores">0 Pending Chores</div>

                </div>

            </section>



            <section class="mt-10">

                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">

                    <h2 class="text-2xl font-bold">Your Groups</h2>
                    <button onclick="addGroup()" class="bg-emerald-400 hover:bg-emerald-300 text-black font-bold px-6 py-3 
                    rounded-2xl transition duration-300">+ Add Group</button>
                </div>

                <div id="cardContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
            </section>
        </main>
    </div>

    <script src="home.js"></script>

</body>

</html>
